<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Neon Snake · Unblockable</title><link rel="stylesheet" href="game.css"><script defer src="snake.js"></script></head><body><main class="wrap"><div class="stats"><div><small>SCORE</small><strong id="score">0</strong></div><div><small>BEST</small><strong id="best">0</strong></div><button id="start">Play</button><button class="secondary" id="pause" disabled>Pause</button></div><canvas id="board" width="400" height="400" tabindex="0" aria-label="Snake game board"></canvas><p class="snake-status" id="status">Press Play to start.</p><div class="pad"><button data-dir="left" aria-label="Move left">←</button><button data-dir="up" aria-label="Move up">↑</button><button data-dir="down" aria-label="Move down">↓</button><button data-dir="right" aria-label="Move right">→</button></div><p class="hint">Eat the pink squares. Avoid walls and your own tail.</p></main></body></html>
